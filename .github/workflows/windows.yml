# Windows. The library is pure standard library, so nothing is compiled here;
# what these three prove is that the RUNTIME behaves the same everywhere.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is wasted runner time. A push to main is not cancelled:
  # when CI goes red we want to know which commit did it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff

      - name: Lint
        working-directory: python
        run: python -m ruff check mpeqs/__init__.py tests

      - name: Test
        working-directory: python
        run: python -m pytest tests -q
