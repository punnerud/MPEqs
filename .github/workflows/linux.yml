# Linux. The library is pure standard library, so nothing is compiled here;
# what these three prove is that the RUNTIME behaves the same everywhere.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is wasted runner time. A push to main is not cancelled:
  # when CI goes red we want to know which commit did it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Named explicitly so branch protection can require this exact context.
    name: Linux ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff

      - name: Lint
        working-directory: python
        run: python -m ruff check mpeqs/__init__.py tests

      - name: Test
        working-directory: python
        run: python -m pytest tests -q

      - name: The wheel installs and answers in a clean environment
        working-directory: python
        run: |
          pip install build && python -m build
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python -c "import mpeqs; from fractions import Fraction; assert mpeqs.solve({'solver':'arith','answer':'(17/100)*250'}) == Fraction(85,2)"
